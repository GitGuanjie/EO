name: Migrate EO QEC paper PDF
on:
  push:
    branches:
      - migration/eo-native-qec-20261101
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the typeset PDF from the existing research branch
        run: |
          git clone --quiet --depth 1 --branch research/eo-native-qec-working-paper-2026-11 https://github.com/GitGuanjie/Nuclear-high-spin-VPC.git /tmp/eo-qec-previous
          cp /tmp/eo-qec-previous/research/eo-native-qec/PAPER.pdf research/eo-native-qec/PAPER.pdf
          test -s research/eo-native-qec/PAPER.pdf
          file research/eo-native-qec/PAPER.pdf
      - name: Commit PDF to EO research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/eo-native-qec/PAPER.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: import EO-native QEC paper PDF [skip ci]"
            git push
          fi
